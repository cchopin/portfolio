<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Article - Clémence Chopin</title>
    <link rel="stylesheet" href="css/style.css?v=2">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">CC</div>
            <ul class="nav-menu">
                <li><a href="index.html" class="nav-link">Accueil</a></li>
                <li><a href="projets.html" class="nav-link">Projets</a></li>
                <li><a href="competences.html" class="nav-link">Compétences</a></li>
                <li><a href="articles.html" class="nav-link active">Articles</a></li>
                <li><a href="index.html#contact" class="nav-link">Contact</a></li>
            </ul>
        </div>
    </nav>

    <section class="section" style="padding-top: 8rem;">
        <div class="container">
            <a href="articles.html" class="back-button">← Retour aux articles</a>
            <div class="article-container">
                <div id="article-content" class="article-content">
                    <div class="loading">
                        <p>Chargement de l'article...</p>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2025 Clémence Chopin</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="js/main.js"></script>

    <script>
        mermaid.initialize({
            startOnLoad: false,
            theme: 'base',
            securityLevel: 'loose',
            themeVariables: {
                darkMode: true,
                background: 'transparent',
                primaryColor: '#3b82f6',
                primaryTextColor: '#e2e8f0',
                primaryBorderColor: '#4b5563',
                lineColor: '#6b7280',
                secondaryColor: '#1e293b',
                tertiaryColor: '#0f172a',
                mainBkg: '#1e293b',
                nodeBorder: '#4b5563',
                clusterBkg: '#0f172a',
                titleColor: '#e2e8f0',
                edgeLabelBackground: '#1e293b',
                textColor: '#e2e8f0',
                nodeTextColor: '#e2e8f0',
                actorBkg: '#1e293b',
                actorTextColor: '#e2e8f0',
                actorLineColor: '#6b7280',
                signalColor: '#e2e8f0',
                signalTextColor: '#e2e8f0',
                labelBoxBkgColor: '#1e293b',
                labelBoxBorderColor: '#4b5563',
                labelTextColor: '#e2e8f0',
                loopTextColor: '#e2e8f0',
                noteBkgColor: '#374151',
                noteTextColor: '#e2e8f0',
                noteBorderColor: '#4b5563'
            }
        });

        const urlParams = new URLSearchParams(window.location.search);
        const articleFile = urlParams.get('file');

        if (!articleFile) {
            document.getElementById('article-content').innerHTML = '<div class="error"><p>Aucun article spécifié</p></div>';
        } else {
            fetch(`articles/${articleFile}.md`)
                .then(response => {
                    if (!response.ok) throw new Error('Article non trouvé');
                    return response.text();
                })
                .then(markdown => {
                    marked.setOptions({
                        breaks: true,
                        gfm: true,
                        highlight: function(code, lang) {
                            if (lang && hljs.getLanguage(lang)) {
                                try {
                                    return hljs.highlight(code, { language: lang }).value;
                                } catch (err) {}
                            }
                            return hljs.highlightAuto(code).value;
                        }
                    });

                    const html = marked.parse(markdown);
                    document.getElementById('article-content').innerHTML = html;

                    const h1 = document.querySelector('.article-content h1');
                    if (h1) document.title = h1.textContent + ' - Clémence Chopin';

                    document.querySelectorAll('pre code.language-mermaid').forEach((block) => {
                        const mermaidDiv = document.createElement('div');
                        mermaidDiv.className = 'mermaid';
                        mermaidDiv.textContent = block.textContent;
                        block.parentElement.replaceWith(mermaidDiv);
                    });

                    const mermaidDivs = document.querySelectorAll('.mermaid');
                    if (mermaidDivs.length > 0) {
                        mermaid.run({ nodes: mermaidDivs }).then(() => {
                            document.querySelectorAll('.mermaid svg').forEach(svg => {
                                svg.style.background = 'transparent';
                                const bgRect = svg.querySelector('rect');
                                if (bgRect) bgRect.setAttribute('fill', 'transparent');
                            });
                        });
                    }

                    document.querySelectorAll('pre code').forEach((block) => {
                        hljs.highlightElement(block);
                    });
                })
                .catch(error => {
                    document.getElementById('article-content').innerHTML =
                        `<div class="error"><p>Erreur lors du chargement de l'article</p><p style="font-size: 0.9rem; margin-top: 1rem;">${error.message}</p></div>`;
                });
        }
    </script>
</body>
</html>
